name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENCODE_TEST_VERSION: "2.0.27"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  relay:
    name: Relay container gate
    uses: ./.github/workflows/relay.yml
    permissions:
      contents: read

  tests:
    name: Engine, services and native UI checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Engine and service tests
        run: python -m pytest tests -v --tb=short

      - name: Install OpenCode 2 for native acceptance
        run: npm install -g "@opencode/cli@$OPENCODE_TEST_VERSION"

      - name: Native OpenCode 2 acceptance (local model, no paid requests)
        run: python tests/verify_opencode_v2.py

      - name: Native managed account isolation and failover (local model)
        run: python tests/verify_opencode_accounts.py

      - name: Native quota reader contract (synthetic credentials, no model calls)
        run: python tests/verify_opencode_accounts.py --usage-only

      - name: Native UI interaction checks
        run: python tests/verify_ui.py

      - name: Native account management and quota UI checks
        run: python tests/verify_accounts_ui.py

      - name: Native queue scrolling stress
        run: python tests/verify_queue_scroll.py

      - name: Native Internet pairing controls
        run: python tests/verify_internet_ui.py

      - name: Ensure phone browser is available
        run: python -m playwright install msedge

      - name: LAN and Internet phone acceptance
        run: |
          python tests/verify_mobile.py
          python tests/verify_mobile_internet.py
          python tests/verify_internet_stack.py

      - name: PWA HTTPS service worker and pairing acceptance
        run: python tests/verify_pwa.py
