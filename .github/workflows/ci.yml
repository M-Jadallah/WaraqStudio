name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENCODE_TEST_VERSION: "2.0.32"
  OPENCODE_TEST_EXECUTABLE: "build/embedded-runtime/opencode/opencode.exe"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  relay:
    name: Relay container gate
    uses: ./.github/workflows/relay.yml
    permissions:
      contents: read

  tests:
    name: Engine, services and native UI checks
    runs-on: windows-latest
    env:
      QT_QUICK_BACKEND: software
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:/Windows/Fonts
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Engine and service tests
        run: python -m pytest tests -v --tb=short

      - name: Prepare pinned embedded runtime (Windows x64)
        run: python scripts/prepare_embedded_engine.py

      - name: Native OpenCode 2 acceptance (local model, no paid requests)
        run: python tests/verify_opencode_v2.py

      - name: Embedded account engine native fixture (no OAuth or paid model)
        run: python tests/verify_embedded_engine.py

      - name: Native idle, profile reopen and blocked-engine recovery
        timeout-minutes: 6
        run: python -u tests/verify_idle.py

      - name: Native UI interaction checks
        timeout-minutes: 5
        env:
          QT_QUICK_BACKEND: software
          QT_QPA_PLATFORM: offscreen
          WARAQ_UI_CATALOG_DELAY_MS: "300"
        run: python -u tests/verify_ui.py

      - name: Petrol theme, layout and dialog matrix
        timeout-minutes: 5
        run: python tests/verify_redesign.py

      - name: Bold stage badges, status identity and contrast
        timeout-minutes: 2
        run: python tests/verify_stage_badges.py

      - name: Native account management and quota UI checks
        run: python tests/verify_accounts_ui.py

      - name: Task details and frozen account comparison table
        timeout-minutes: 3
        run: |
          python tests/verify_task_dialog.py
          python tests/verify_account_table.py

      - name: Native queue scrolling stress
        run: python tests/verify_queue_scroll.py

      - name: Native Internet pairing controls
        run: python tests/verify_internet_ui.py

      - name: Ensure phone browser is available
        run: python -m playwright install msedge

      - name: LAN and Internet phone acceptance
        env:
          WARAQ_STACK_LIBRARY_DELAY_MS: "6000"
        run: |
          python tests/verify_mobile.py
          python tests/verify_mobile_internet.py
          python tests/verify_internet_stack.py

      - name: PWA HTTPS service worker and pairing acceptance
        run: python tests/verify_pwa.py
