name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Test gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Engine and service tests
        run: python -m pytest tests/test_engine.py -v --tb=short

      - name: Native UI interaction checks
        run: python tests/verify_ui.py

  build-release:
    name: Build exe and publish release
    needs: tests
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build Windows bundle (PyInstaller)
        run: python build_windows.py

      - name: Verify bundle contents
        run: |
          test -f Windows/WaraqStudio/WaraqStudio.exe
          ls Windows/WaraqStudio | head -20

      - name: Smoke test bundled exe (environment check)
        run: |
          ./Windows/WaraqStudio/WaraqStudio.exe --check-environment env-report.json
          cat env-report.json

      - name: Smoke test bundled exe (UI launch)
        run: ./Windows/WaraqStudio/WaraqStudio.exe --smoke

      - name: Package portable bundle
        shell: pwsh
        run: |
          Copy-Item Start.cmd,README_AR.md Windows/WaraqStudio/
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path Windows/WaraqStudio -DestinationPath "dist/WaraqStudio-$env:TAG-windows-x64.zip" -Force

      - name: Create source zip
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="WaraqStudio-$TAG/" -o "dist/WaraqStudio-$TAG-source.zip" HEAD

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = $env:TAG -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.exe
          retention-days: 7

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<EOF
          إصدار تلقائي بواسطة GitHub Actions (وسم $TAG).

          ## الملفات المرفقة
          - \`WaraqStudio-${TAG#v}-setup.exe\` — **ملف التثبيت**: شغّله وسيثبّت التطبيق وكل ما يحتاجه (Python وQt وFFmpeg وyt-dlp مضمّنة داخله — لا يحتاج تثبيت أي شيء آخر) في Program Files، مع اختصار في قائمة ابدأ (وسطح المكتب اختياريًا) وإمكانية الإزالة من إعدادات Windows.
          - \`WaraqStudio-$TAG-windows-x64.zip\` — بديل محمول دون تثبيت: فك الضغط وشغّل \`WaraqStudio.exe\` (أو \`Start.cmd\`).
          - \`WaraqStudio-$TAG-source.zip\` — نسخة مضغوطة من الكود المصدري.

          ## ملاحظات
          - أدخل مفاتيح Deepgram وOpenCode من شاشة الإعدادات داخل التطبيق — لا تُضمَّن أي مفاتيح أو بيانات في التثبيت.
          - بيانات المستخدم تُحفظ في \`%LOCALAPPDATA%\\WaraqStudio\` ولا تُحذف عند إزالة التطبيق.
          - يتوفر أيضًا «Source code (zip)» يُنشئه GitHub تلقائيًا أسفل الإصدار.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.zip dist/*-setup.exe \
            --title "WaraqStudio $TAG" \
            --notes-file RELEASE_NOTES.md
