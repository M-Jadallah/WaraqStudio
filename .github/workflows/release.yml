name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # Needed by the artifact purge step below; without it the purge is a no-op
  # and the account's artifact storage stays full.
  actions: write

env:
  OPENCODE_TEST_VERSION: "2.0.32"
  OPENCODE_TEST_EXECUTABLE: "build/embedded-runtime/opencode/opencode.exe"

defaults:
  run:
    shell: bash

# Serialize release builds so rapid pushes publish one after another
# instead of racing on tags and release assets.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  relay:
    name: Relay container gate
    uses: ./.github/workflows/relay.yml
    permissions:
      contents: read

  tests:
    name: Test gate
    runs-on: windows-latest
    env:
      QT_QUICK_BACKEND: software
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:/Windows/Fonts
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Engine and service tests
        run: python -m pytest tests -v --tb=short

      - name: Prepare pinned embedded runtime (Windows x64)
        run: python scripts/prepare_embedded_engine.py

      - name: Native OpenCode 2 acceptance (local model, no paid requests)
        run: python tests/verify_opencode_v2.py

      - name: Embedded account engine native fixture (no OAuth or paid model)
        run: python tests/verify_embedded_engine.py

      - name: Native idle, profile reopen and blocked-engine recovery
        timeout-minutes: 6
        run: python -u tests/verify_idle.py

      - name: Native UI interaction checks
        timeout-minutes: 5
        env:
          WARAQ_UI_CATALOG_DELAY_MS: "300"
        run: python -u tests/verify_ui.py

      - name: Petrol theme, layout and dialog matrix
        timeout-minutes: 5
        run: python tests/verify_redesign.py

      - name: Bold stage badges, status identity and contrast
        timeout-minutes: 2
        run: python tests/verify_stage_badges.py

      - name: Native account management and quota UI checks
        run: python tests/verify_accounts_ui.py

      - name: Native queue scrolling stress
        run: python tests/verify_queue_scroll.py

      - name: Native Internet pairing controls
        run: python tests/verify_internet_ui.py

      - name: Ensure phone browser is available
        run: python -m playwright install msedge

      - name: LAN and Internet phone acceptance
        run: |
          python tests/verify_mobile.py
          python tests/verify_mobile_internet.py
          python tests/verify_internet_stack.py

      - name: PWA HTTPS service worker and pairing acceptance
        run: python tests/verify_pwa.py

  build-release:
    name: Build exe and publish release
    needs: [tests, relay]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Purge stale workflow artifacts
        # Every build here produces ~370 MB and the account's artifact storage
        # is small, so leftover artifacts must go or the next upload dies with
        # "Artifact storage quota has been hit". Deleting is best-effort: the
        # build must never depend on it succeeding.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-1d +%Y-%m-%dT%H:%M:%SZ)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and .created_at < \"$cutoff\") | .id" \
          | while read -r id; do
              [ -n "$id" ] || continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null
              echo "deleted stale artifact $id"
            done
          echo "Artifact purge finished."

      - name: Compute version and tag
        run: |
          # Tag pushes (v*) keep their exact version; ordinary pushes to main
          # auto-increment: base version from waraq/__init__.py + build number.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            BASE="$(python -c "import re; print(re.search(r'__version__ *= *\"([^\"]+)\"', open('waraq/__init__.py', encoding='utf-8').read()).group(1))")"
            VERSION="$BASE.${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION (tag v$VERSION)"

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Prepare pinned embedded runtime (Windows x64)
        run: python scripts/prepare_embedded_engine.py

      - name: Build Windows bundle (PyInstaller)
        run: python build_windows.py

      - name: Verify bundle contents
        run: |
          test -f Windows/WaraqStudio/WaraqStudio.exe
          ls Windows/WaraqStudio | head -20

      - name: Clean environment bundled engine and UI startup
        run: python scripts/verify_clean_package.py

      - name: Package portable bundle
        shell: pwsh
        run: |
          Copy-Item Start.cmd,README_AR.md Windows/WaraqStudio/
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path Windows/WaraqStudio -DestinationPath "dist/WaraqStudio-$env:TAG-windows-x64.zip" -Force

      - name: Create source zip
        run: |
          mkdir -p dist
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive --format=zip --prefix="WaraqStudio-$TAG/" -o "dist/WaraqStudio-$TAG-source.zip" "$GITHUB_SHA"

      - name: Package the Coolify gateway from this commit
        run: python deploy/package_relay.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = $env:TAG -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Verify installer (install, launch and uninstall)
        shell: pwsh
        timeout-minutes: 10
        run: |
          ./tests/verify_installer.ps1 -InstallerPath "dist/WaraqStudio-$env:VERSION-setup.exe" -ExpectedVersion $env:VERSION -ExpectedOpenCodeVersion $env:OPENCODE_TEST_VERSION

      - name: Record exact source commit and asset checksums
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()

          dist = Path('dist')
          assets = sorted(path for path in dist.iterdir()
                          if path.is_file() and path.suffix in ('.zip', '.exe', '.sha256'))
          required = {'WaraqGateway-Coolify.zip', 'WaraqGateway-Coolify.zip.sha256',
                      f"WaraqStudio-{os.environ['TAG']}-source.zip",
                      f"WaraqStudio-{os.environ['TAG']}-windows-x64.zip",
                      f"WaraqStudio-{os.environ['VERSION']}-setup.exe"}
          assert required.issubset({path.name for path in assets}), 'Release assets are incomplete'
          provenance = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
              'tag': os.environ['TAG'],
              'source_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/tree/{os.environ['GITHUB_SHA']}",
              'compose_path': 'compose.relay.yaml',
              'assets': [{'name': path.name, 'sha256': sha256(path)} for path in assets],
          }
          receipt = dist / f"WaraqStudio-{os.environ['TAG']}-provenance.json"
          receipt.write_text(json.dumps(provenance, indent=2) + '\n', encoding='utf-8')
          (dist / 'SHA256SUMS').write_text(''.join(f'{sha256(path)}  {path.name}\n'
                                                for path in sorted(assets + [receipt])), encoding='ascii')
          PY

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<EOF
          إصدار تلقائي بواسطة GitHub Actions (وسم $TAG، من الالتزام ${GITHUB_SHA:0:7}).

          ## الملفات المرفقة
          - \`WaraqStudio-${TAG#v}-setup.exe\` — **ملف التثبيت**: يثبّت التطبيق مع Python وQt وFFmpeg وyt-dlp المضمّنة في Program Files، مع اختصار في قائمة ابدأ (وسطح المكتب اختياريًا) وإمكانية الإزالة من إعدادات Windows.
          - \`WaraqStudio-$TAG-windows-x64.zip\` — بديل محمول دون تثبيت: فك الضغط وشغّل \`WaraqStudio.exe\` (أو \`Start.cmd\`).
          - \`WaraqStudio-$TAG-source.zip\` — الكود المصدري المثبت على الالتزام الكامل \`$GITHUB_SHA\`، وهو الالتزام نفسه المستخدم لبناء Windows والبوابة.
          - \`WaraqGateway-Coolify.zip\` و\`WaraqGateway-Coolify.zip.sha256\` — حزمة بوابة الإنترنت وDocker Compose وأدلة Coolify وبصمتها، دون بيانات المستخدم أو أسرار الخادم.
          - \`SHA256SUMS\` و\`WaraqStudio-$TAG-provenance.json\` — بصمات الملفات وسجل مصدر الإصدار والالتزام الدقيق.

          ## النشر من المستودع نفسه
          - نسخة Windows للمستخدمين عبر المُثبّت أو الحزمة المحمولة؛ بوابة الخادم عبر Coolify باستخدام \`compose.relay.yaml\` من جذر المستودع، دون تشغيل تطبيق Windows على VPS.
          - [مصدر هذا الإصدار المثبت على الالتزام]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA) · [ملف Compose المطابق]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/compose.relay.yaml).
          - اجتازت بوابة الخادم اختبار Docker Compose وPostgreSQL على Ubuntu قبل إتاحة بناء الإصدار.

          ## ملاحظات
          - تستخدم حسابات ChatGPT محركًا خاصًا مضمّنًا، مع خادم مشترك وجلسة مستقلة لكل محاولة. لا يلزم تثبيت مدير حسابات أو OpenCode أو Node.js خارجيًا لهذا المسار.
          - اجتاز المُثبّت اختبار التثبيت والتشغيل والإزالة على Windows داخل GitHub Actions قبل النشر، واختُبر OpenCode 2 بمزود محلي دون طلبات مدفوعة.
          - تتضمن حزمة Windows x64 محرك الحسابات وOpenCode 2.0.32 وNode.js 24.22.0. تبقى موافقة دخول الحساب وإعداد مزود API ومهارات Word على صاحب الجهاز.
          - يمكنك تحديد عناصر الطابور وحذف سجلاتها مع الاحتفاظ بالملفات. التفريغات TXT المستوردة تعرض مرحلة Word وحدها.
          - تظهر خيارات قالب البرومبت والمادة ومسار النتائج أعلى صفحة إضافة المصدر، قبل استيراد ملفات TXT أو مجلد التفريغات.
          - خُفّضت كلفة تحديث مركز العمليات للطوابير الكبيرة، مع فحص تمرير أصلي بالعجلة وشريط التمرير حتى 2000 عنصر.
          - يتوفر فحص تحديث التطبيق وتنزيل مُثبّت موثَّق بالبصمة من الإعدادات. الإصدارات الخاصة تحتاج رمز GitHub شخصيًا له صلاحية قراءة المستودع.
          - أدخل مفاتيح Deepgram وOpenCode من شاشة الإعدادات داخل التطبيق — لا تُضمَّن أي مفاتيح أو بيانات في التثبيت.
          - بيانات المستخدم تُحفظ في \`%LOCALAPPDATA%\\WaraqStudio\` ولا تُحذف عند إزالة التطبيق.
          - يتوفر أيضًا «Source code (zip)» يُنشئه GitHub تلقائيًا أسفل الإصدار.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Existing tags are immutable, including annotated tags (peeled SHA).
          # A transport/auth failure must never be mistaken for a missing tag.
          check_tag() {
            local refs status resolved
            if refs="$(git ls-remote --exit-code --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"; then
              resolved="$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ {print $1; exit}')"
              if [[ -z "$resolved" ]]; then
                resolved="$(printf '%s\n' "$refs" | awk 'NR == 1 {print $1}')"
              fi
              if [[ "$resolved" != "$GITHUB_SHA" ]]; then
                echo "::error::Refusing to publish: tag $TAG points to $resolved, expected $GITHUB_SHA. Existing tags will not be changed."
                exit 1
              fi
              return 0
            else
              status=$?
              if [[ "$status" != 2 ]]; then
                echo "::error::Could not verify remote tag $TAG (git exit $status)."
                exit "$status"
              fi
              return 2
            fi
          }
          if check_tag; then
            echo "Verified immutable tag $TAG at $GITHUB_SHA."
          else
            # This branch runs only for an absent tag; all other errors exit.
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          check_tag
          if gh release view "$TAG" --json id --jq .id >/dev/null 2>&1; then
            gh release edit "$TAG" --title "WaraqStudio $TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --verify-tag --target "$GITHUB_SHA" \
              --title "WaraqStudio $TAG" --notes-file RELEASE_NOTES.md
          fi
          # Recheck immediately before attaching assets. Never move/delete tags.
          check_tag
          gh release upload "$TAG" dist/*.zip dist/*-setup.exe dist/*.sha256 \
            dist/SHA256SUMS "dist/WaraqStudio-$TAG-provenance.json" --clobber

      - name: Upload build as fallback artifact
        # The release assets above ARE the deliverable, and release storage is
        # separate from Actions artifact storage. Uploading the same ~370 MB
        # into artifacts on every run is what exhausted the account quota and
        # killed the job before the release could be published. This now fires
        # only when something above failed, so a broken build is still
        # recoverable from the run page, and it can never fail the job.
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
            dist/SHA256SUMS
            dist/*-provenance.json
            env-report.json
          retention-days: 1
